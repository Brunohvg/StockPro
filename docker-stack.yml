# ==============================================================================
# DOCKER STACK - STOCKPRO V16
# ==============================================================================
# Uso: docker stack deploy -c docker-stack.yml stockpro
# ==============================================================================

version: '3.8'

services:
  # --------------------------------------------------------------------------
  # MIGRATION (one-shot)
  # --------------------------------------------------------------------------
  migration:
    image: ${STOCKPRO_IMAGE:-brunobh51/stockpro:latest}
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_db && python manage.py collectstatic --noinput"
    environment: &env
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin/}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://stockpro_redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://stockpro_redis:6379/1}
      C_FORCE_ROOT: "1"
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      WHATSAPP_SUPPORT: ${WHATSAPP_SUPPORT:-5511999999999}
    networks:
      - app_network
    volumes:
      - stockpro_static:/app/staticfiles
      - stockpro_media:/app/media
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # --------------------------------------------------------------------------
  # APP (Gunicorn)
  # --------------------------------------------------------------------------
  stockpro:
    image: ${STOCKPRO_IMAGE:-brunobh51/stockpro:latest}
    command: >
      gunicorn stock_control.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-2}
      --threads ${GUNICORN_THREADS:-4}
      --timeout 120
      --access-logfile -
      --error-logfile -
    environment: *env
    volumes:
      - stockpro_static:/app/staticfiles
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
    networks:
      - traefik_public
      - app_network
    deploy:
      mode: replicated
      replicas: ${WEB_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"
        - "traefik.http.routers.stockpro.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.stockpro.entrypoints=websecure"
        - "traefik.http.routers.stockpro.tls.certresolver=le"
        - "traefik.http.services.stockpro.loadbalancer.server.port=8000"
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-1}
          memory: ${WEB_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - migration
      - stockpro_redis

  # --------------------------------------------------------------------------
  # CELERY WORKER
  # --------------------------------------------------------------------------
  stockpro_worker:
    image: ${STOCKPRO_IMAGE:-brunobh51/stockpro:latest}
    command: celery -A stock_control worker -l info -Q default --concurrency=${CELERY_CONCURRENCY:-2}
    environment: *env
    networks:
      - app_network
    volumes:
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-1}
          memory: ${WORKER_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      disable: true
    depends_on:
      - stockpro_redis

  # --------------------------------------------------------------------------
  # CELERY BEAT
  # --------------------------------------------------------------------------
  stockpro_beat:
    image: ${STOCKPRO_IMAGE:-brunobh51/stockpro:latest}
    command: celery -A stock_control beat -l info
    environment: *env
    networks:
      - app_network
    volumes:
      - stockpro_beat:/data
      - stockpro_backups:/data/backups
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      disable: true
    depends_on:
      - stockpro_redis

  # --------------------------------------------------------------------------
  # REDIS
  # --------------------------------------------------------------------------
  stockpro_redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - stockpro_redis:/data
    networks:
      - app_network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: ${REDIS_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      disable: true

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  stockpro_static:
  stockpro_media:
  stockpro_imports:
  stockpro_redis:
  stockpro_beat:
  stockpro_backups:

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  traefik_public:
    external: true
  app_network:
    external: true
