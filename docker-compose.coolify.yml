services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SERVICE_HEX_64_DJANGO}
      DEBUG: "False"
      DOMAIN: ${SERVICE_FQDN_WEB_8000}
      SITE_URL: ${SERVICE_URL_WEB_8000}
      SERVICE_URL_WEB_8000: /
      DATABASE_URL: ${DATABASE_URL:?Configure a URL interna do PostgreSQL no Coolify}
      PORT: "8000"
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-ops19x/}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-2-latest}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-500}
      WHATSAPP_SUPPORT: ${WHATSAPP_SUPPORT:-5511999999999}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
      - stockpro_backups:/data/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthcheck/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "stock_control", "worker", "-l", "info", "--concurrency=2"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SERVICE_HEX_64_DJANGO}
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?Configure a URL interna do PostgreSQL no Coolify}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-2-latest}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-500}
      WHATSAPP_SUPPORT: ${WHATSAPP_SUPPORT:-5511999999999}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-ops19x/}
      SKIP_DJANGO_BOOTSTRAP: "True"
    volumes:
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
      - stockpro_backups:/data/backups
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - stockpro_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  stockpro_redis:
  stockpro_media:
  stockpro_imports:
  stockpro_backups:
