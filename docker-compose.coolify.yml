services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SERVICE_HEX_64_DJANGO}
      DEBUG: "False"
      DOMAIN: ${SERVICE_FQDN_WEB_8000}
      SITE_URL: ${SERVICE_URL_WEB_8000}
      SERVICE_URL_WEB_8000: /
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stockpro
      DB_USER: stockpro
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PORT: "8000"
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-ops19x/}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
      - stockpro_backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthcheck/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "stock_control", "worker", "-l", "info", "--concurrency=2"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SERVICE_HEX_64_DJANGO}
      DEBUG: "False"
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stockpro
      DB_USER: stockpro
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-ops19x/}
      SKIP_DJANGO_BOOTSTRAP: "True"
    volumes:
      - stockpro_media:/app/media
      - stockpro_imports:/app/imports
      - stockpro_backups:/data/backups
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpro
      POSTGRES_USER: stockpro
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - stockpro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpro -d stockpro"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - stockpro_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  stockpro_postgres:
  stockpro_redis:
  stockpro_media:
  stockpro_imports:
  stockpro_backups:
