{% comment %}Abas entre telas irmãs (o menu lateral mostra só a principal). tabs: lista de (rótulo, url, ativo).{% endcomment %}
<nav class="mb-6 flex gap-1 overflow-x-auto border-b border-slate-200" aria-label="Seções">
    {% for label, href, on in tabs %}
    <a href="{{ href }}" class="-mb-px whitespace-nowrap border-b-2 px-3 py-2 text-sm font-medium {% if on %}border-indigo-600 text-indigo-700{% else %}border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-800{% endif %}"{% if on %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>
