{# Ícone por tipo de evento do histórico #}
<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ring-1 ring-inset
{% if e.kind == 'STATUS' %}bg-amber-50 text-amber-700 ring-amber-600/20{% elif e.kind == 'PLAN' %}bg-indigo-50 text-indigo-700 ring-indigo-600/20{% elif e.kind == 'SECURITY' %}bg-rose-50 text-rose-700 ring-rose-600/20{% elif e.kind == 'CREATED' %}bg-emerald-50 text-emerald-700 ring-emerald-600/20{% else %}bg-slate-50 text-slate-600 ring-slate-500/20{% endif %}">
<i data-lucide="{% if e.kind == 'STATUS' %}toggle-right{% elif e.kind == 'PLAN' %}layers{% elif e.kind == 'TRIAL' %}hourglass{% elif e.kind == 'DUE_DATE' %}calendar{% elif e.kind == 'NOTE' %}sticky-note{% elif e.kind == 'SECURITY' %}shield{% elif e.kind == 'CREATED' %}sparkles{% else %}dot{% endif %}" class="h-4 w-4"></i>
</span>
